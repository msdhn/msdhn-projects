[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "core-service"
version = "0.1.0"
description = "Core Service project"
requires-python = ">=3.14"
dependencies = [
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-azure-native>=3.0.0,<4.0.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package=false

[tool.setuptools.packages.find]
where = ["."]
namespaces = false

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

# Anchors ruff to this directory so local packages sort as first-party
# whether ruff runs from here or from the repo root (pre-commit).
[tool.ruff]
src = ["."]


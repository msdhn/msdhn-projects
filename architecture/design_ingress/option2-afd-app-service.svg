<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img"><title>Option 2: Front Door directly to App Service</title><desc>AFD managed private endpoint connects via Private Link directly to the App Service. No inbound component in the hub. Outbound goes via VNet integration, peering and Azure Firewall.</desc><style>
text{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.out{stroke:#BA7517;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-pink rect{fill:#FBEAF0;stroke:#993556}.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowOut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><rect width="680" height="650" fill="#FFFFFF"/><g class="c-gray"><rect x="260" y="30" width="160" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="52.0" text-anchor="middle" dominant-baseline="central">Internet users</text></g><line x1="340" y1="74" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/><g class="c-purple"><rect x="220" y="110" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="128" text-anchor="middle" dominant-baseline="central">Azure Front Door Premium</text><text class="ts" x="340.0" y="148" text-anchor="middle" dominant-baseline="central">Global WAF, CDN, DDoS</text></g><path d="M260 166 L260 182 L170 182 L170 198" class="arr" marker-end="url(#arrow)"/><g class="c-purple"><rect x="60" y="200" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="218" text-anchor="middle" dominant-baseline="central">AFD managed PE</text><text class="ts" x="170.0" y="238" text-anchor="middle" dominant-baseline="central">Microsoft-managed network</text></g><g class="c-teal"><rect x="40" y="320" width="260" height="264" rx="20" stroke-width="0.5"/><text class="th" x="60" y="342" dominant-baseline="central">Hub VNet</text></g><g class="c-coral"><rect x="380" y="320" width="260" height="264" rx="20" stroke-width="0.5"/><text class="th" x="400" y="342" dominant-baseline="central">Spoke VNet (customer)</text></g><text class="ts" x="340" y="342" text-anchor="middle" dominant-baseline="central">Peering</text><line x1="340" y1="356" x2="340" y2="576" class="leader"/><g class="c-gray"><rect x="60" y="508" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="526" text-anchor="middle" dominant-baseline="central">Azure Firewall</text><text class="ts" x="170.0" y="546" text-anchor="middle" dominant-baseline="central">All outbound traffic</text></g><g class="c-gray"><rect x="400" y="364" width="156" height="56" rx="8" stroke-width="0.5"/><text class="th" x="478.0" y="382" text-anchor="middle" dominant-baseline="central">Databricks PEs</text><text class="ts" x="478.0" y="402" text-anchor="middle" dominant-baseline="central">PE subnet</text></g><g class="c-gray"><rect x="400" y="436" width="156" height="56" rx="8" stroke-width="0.5"/><text class="th" x="478.0" y="454" text-anchor="middle" dominant-baseline="central">App Service PE</text><text class="ts" x="478.0" y="474" text-anchor="middle" dominant-baseline="central">Internal access only</text></g><g class="c-gray"><rect x="400" y="508" width="156" height="56" rx="8" stroke-width="0.5"/><text class="th" x="478.0" y="526" text-anchor="middle" dominant-baseline="central">VNet integration</text><text class="ts" x="478.0" y="546" text-anchor="middle" dominant-baseline="central">Delegated subnet</text></g><g class="c-pink"><rect x="400" y="200" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510.0" y="218" text-anchor="middle" dominant-baseline="central">App Service</text><text class="ts" x="510.0" y="238" text-anchor="middle" dominant-baseline="central">Public PaaS, access disabled</text></g><path d="M556 464 L578 464 L578 258" class="leader"/><path d="M608 256 L608 536 L558 536" class="out" marker-end="url(#arrowOut)"/><line x1="400" y1="536" x2="282" y2="536" class="out" marker-end="url(#arrowOut)"/><line x1="170" y1="564" x2="170" y2="604" class="out" marker-end="url(#arrowOut)"/><text class="ts" x="170" y="622" text-anchor="middle" dominant-baseline="central">Internet (egress)</text><text class="ts" x="360" y="622" dominant-baseline="central">Solid = inbound, amber dashed = outbound</text><line x1="280" y1="232" x2="398" y2="232" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text class="ts" x="339" y="214" text-anchor="middle" dominant-baseline="central">Private Link</text><text class="ts" x="170" y="428" text-anchor="middle" dominant-baseline="central">No inbound component</text></svg>
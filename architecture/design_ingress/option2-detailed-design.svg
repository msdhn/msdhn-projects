<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Option 2 detailed design</title><desc>Users resolve cust01.msdhn.example.com via public DNS to Front Door Premium. The endpoint and custom domain are protected by a WAF security policy; the route forwards HTTPS to an origin group whose origin uses Private Link (sites, West Europe). Front Door connects through its managed private endpoint to the App Service in the customer spoke, which has public access disabled and uses the customer certificate from Key Vault. The App Service private endpoint in the spoke PLE subnet resolves through the privatelink.azurewebsites.net zone in the hub. Outbound traffic goes through VNet integration to Azure Firewall in the hub.</desc><style>
text{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.out{stroke:#BA7517;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-pink rect{fill:#FBEAF0;stroke:#993556}.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowOut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><rect width="680" height="850" fill="#FFFFFF"/><g class="c-gray"><rect x="40" y="30" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="130.0" y="52.0" text-anchor="middle" dominant-baseline="central">Users (internet)</text></g><g class="c-gray"><rect x="400" y="24" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="520.0" y="42" text-anchor="middle" dominant-baseline="central">Public DNS zone</text><text class="ts" x="520.0" y="62" text-anchor="middle" dominant-baseline="central">msdhn.example.com</text></g><line x1="220" y1="52" x2="398" y2="52" class="leader"/><text class="ts" x="309" y="40" text-anchor="middle" dominant-baseline="central">CNAME, TXT</text><g class="c-purple"><rect x="40" y="108" width="600" height="196" rx="20" stroke-width="0.5"/><text class="th" x="60" y="130" dominant-baseline="central">Front Door Premium profile (core subscription)</text></g><g class="c-gray"><rect x="60" y="150" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="195.0" y="168" text-anchor="middle" dominant-baseline="central">Endpoint + custom domain</text><text class="ts" x="195.0" y="188" text-anchor="middle" dominant-baseline="central">cust01.msdhn.example.com</text></g><g class="c-gray"><rect x="350" y="150" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="485.0" y="168" text-anchor="middle" dominant-baseline="central">Security policy → WAF</text><text class="ts" x="485.0" y="188" text-anchor="middle" dominant-baseline="central">DRS 2.1, bot manager, rate limit</text></g><g class="c-gray"><rect x="60" y="228" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="195.0" y="246" text-anchor="middle" dominant-baseline="central">Route</text><text class="ts" x="195.0" y="266" text-anchor="middle" dominant-baseline="central">/*, HTTPS only, no caching</text></g><g class="c-gray"><rect x="350" y="228" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="485.0" y="246" text-anchor="middle" dominant-baseline="central">Origin group → origin</text><text class="ts" x="485.0" y="266" text-anchor="middle" dominant-baseline="central">Private Link: sites, West Europe</text></g><line x1="130" y1="74" x2="130" y2="148" class="arr" marker-end="url(#arrow)"/><line x1="330" y1="178" x2="348" y2="178" class="arr" marker-end="url(#arrow)"/><line x1="195" y1="206" x2="195" y2="226" class="arr" marker-end="url(#arrow)"/><line x1="330" y1="256" x2="348" y2="256" class="arr" marker-end="url(#arrow)"/><g class="c-purple"><rect x="350" y="328" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="485.0" y="346" text-anchor="middle" dominant-baseline="central">AFD managed private endpoint</text><text class="ts" x="485.0" y="366" text-anchor="middle" dominant-baseline="central">Microsoft-managed network</text></g><line x1="485" y1="284" x2="485" y2="326" class="arr" marker-end="url(#arrow)"/><g class="c-pink"><rect x="350" y="420" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="485.0" y="438" text-anchor="middle" dominant-baseline="central">App Service (spoke subscription)</text><text class="ts" x="485.0" y="458" text-anchor="middle" dominant-baseline="central">Public access disabled</text></g><line x1="485" y1="384" x2="485" y2="418" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text class="ts" x="497" y="401" dominant-baseline="central">Private Link (approved)</text><g class="c-gray"><rect x="60" y="420" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185.0" y="438" text-anchor="middle" dominant-baseline="central">Key Vault (core)</text><text class="ts" x="185.0" y="458" text-anchor="middle" dominant-baseline="central">Per-customer cert, AFD + App Service</text></g><line x1="310" y1="448" x2="348" y2="448" class="leader"/><g class="c-teal"><rect x="40" y="512" width="260" height="256" rx="20" stroke-width="0.5"/><text class="th" x="60" y="534" dominant-baseline="central">Hub VNet (core)</text></g><g class="c-coral"><rect x="380" y="512" width="260" height="256" rx="20" stroke-width="0.5"/><text class="th" x="400" y="534" dominant-baseline="central">Spoke VNet (cust01)</text></g><text class="ts" x="340" y="534" text-anchor="middle" dominant-baseline="central">Peering</text><line x1="340" y1="548" x2="340" y2="760" class="leader"/><g class="c-gray"><rect x="60" y="552" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="570" text-anchor="middle" dominant-baseline="central">Private DNS zone</text><text class="ts" x="170.0" y="590" text-anchor="middle" dominant-baseline="central">privatelink.azurewebsites.net</text></g><g class="c-gray"><rect x="60" y="624" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="642" text-anchor="middle" dominant-baseline="central">Private DNS Resolver</text><text class="ts" x="170.0" y="662" text-anchor="middle" dominant-baseline="central">Inbound endpoint</text></g><g class="c-gray"><rect x="60" y="696" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170.0" y="714" text-anchor="middle" dominant-baseline="central">Azure Firewall</text><text class="ts" x="170.0" y="734" text-anchor="middle" dominant-baseline="central">DNS proxy, outbound rules</text></g><g class="c-gray"><rect x="400" y="552" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510.0" y="570" text-anchor="middle" dominant-baseline="central">App Service PE</text><text class="ts" x="510.0" y="590" text-anchor="middle" dominant-baseline="central">PLE subnet, internal + SCM</text></g><g class="c-gray"><rect x="400" y="624" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510.0" y="642" text-anchor="middle" dominant-baseline="central">Databricks PEs</text><text class="ts" x="510.0" y="662" text-anchor="middle" dominant-baseline="central">PLE subnet</text></g><g class="c-gray"><rect x="400" y="696" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510.0" y="714" text-anchor="middle" dominant-baseline="central">VNet integration</text><text class="ts" x="510.0" y="734" text-anchor="middle" dominant-baseline="central">Delegated subnet, route all</text></g><line x1="280" y1="580" x2="398" y2="580" class="leader"/><line x1="510" y1="476" x2="510" y2="550" class="leader"/><path d="M620 476 L630 476 L630 724 L622 724" class="out" marker-end="url(#arrowOut)"/><line x1="400" y1="724" x2="282" y2="724" class="out" marker-end="url(#arrowOut)"/><line x1="170" y1="752" x2="170" y2="790" class="out" marker-end="url(#arrowOut)"/><text class="ts" x="170" y="806" text-anchor="middle" dominant-baseline="central">Internet / Data Hub</text><text class="ts" x="340" y="832" text-anchor="middle" dominant-baseline="central">Solid = inbound, dashed = Private Link, amber = outbound, dotted = DNS / certificate reference</text></svg>
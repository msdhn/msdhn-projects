# yaml-language-server: $schema=../../../../../frontdoor-configuration.schema.json
# Sample: applications of customer op001 exposed through Front Door in dev.
apiVersion: platform.msdhn.com/v1
kind: FrontDoorConfiguration
metadata:
  customer: op001
  environment: dev
spec:
  applications:
    - name: kmi                 # kmi-dev.msdhn.com
      appService: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-op001-kmi-dev/providers/Microsoft.Web/sites/app-kmi-dev
      enabled: true
    - name: kom                 # kom-dev.msdhn.com
      appService: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-op001-kom-dev/providers/Microsoft.Web/sites/app-kom-dev
      enabled: false
